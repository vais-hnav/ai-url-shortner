[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-url-shortener"
version = "0.1.0"
description = "AI-powered URL shortener backend"
requires-python = ">=3.10,<3.12"
dependencies = [
  "fastapi==0.136.1",
  "uvicorn==0.46.0",
  "sqlalchemy==2.0.49",
  "asyncpg==0.31.0",
  "alembic==1.18.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "python-dotenv==1.2.2",
  "httpx==0.28.1",
  "authlib==1.6.0",
  "itsdangerous==2.2.0",
  "fastapi-mail==1.5.8",
  "qrcode==8.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_url_shortener_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_url_shortener
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_url_shortener"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ai_url_shortener_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ai_url_shortener
      - JWT_SECRET_KEY=your-super-secret-key-change-this-in-production
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=60
      - APP_NAME=AI URL Shortener
      - DEBUG=false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:

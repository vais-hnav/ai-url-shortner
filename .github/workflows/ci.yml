name: Backend CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    env:
      DEBUG: "true"
      JWT_SECRET_KEY: test-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Compile check
        run: python -m compileall app

      - name: Import app check
        run: python -c "from app.main import app; print('routes', len(app.routes))"

      - name: App smoke check
        run: |
          python -c "from fastapi.testclient import TestClient; from app.main import app; client = TestClient(app); health = client.get('/health'); root = client.get('/', follow_redirects=False); assert health.status_code == 200; assert health.json() == {'status': 'ok'}; assert root.status_code == 307; assert root.headers.get('location') == '/web/auth.html'"
